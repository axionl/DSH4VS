name: Build Visual Studio Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: dotnet restore DSH4VS.sln

      - name: Build VSIX
        run: dotnet build src/DSH4VS/DSH4VS.csproj --configuration Release --no-restore

      - name: Collect VSIX
        shell: pwsh
        run: |
          $vsixFiles = @(Get-ChildItem -Path 'src/DSH4VS/bin/Release' -Filter '*.vsix' -File -Recurse)
          if ($vsixFiles.Count -eq 0) {
            throw '未找到 VSIX 构建产物。'
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $vsixFiles | Copy-Item -Destination artifacts -Force
          $vsixFiles | ForEach-Object { Write-Host "VSIX: $($_.FullName)" }

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH4VS-vsix
          path: artifacts/*.vsix
          if-no-files-found: error
          retention-days: 30
